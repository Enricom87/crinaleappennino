name: Aggiorna previsioni

on:
  schedule:
    # orari UTC: corse notturne dei LAM, poi ECMWF 00 completo, poi corse delle 12
    - cron: "45 5 * * *"
    - cron: "35 7 * * *"
    - cron: "35 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests jinja2
      - name: Scarica i dati dei modelli
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python pipeline/fetch.py
      - name: Tracciati dei percorsi (solo quelli nuovi)
        run: python pipeline/routes.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Costruisci il sito
        run: cd pipeline && python build.py
      - name: Newsletter e allerta neve
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: python pipeline/newsletter.py
      - name: Salva lo stato degli invii
        run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/latest.json data/routes
          git diff --cached --quiet || git commit -m "stato $(date -u +%F_%H%M)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
