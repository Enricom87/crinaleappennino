name: Probe dati (temporaneo)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in norm.daily.nao.gefs.z500.120days.csv norm.daily.ao.gefs.z1000.120days.csv norm.daily.nao.gfs.z500.120days.csv; do
            echo "== $f"; curl -s https://ftp.cpc.ncep.noaa.gov/cwlinks/$f -o f.csv; wc -l f.csv; head -4 f.csv; echo ...; tail -3 f.csv
          done
          echo "== OM 10hPa"
          curl -s "https://api.open-meteo.com/v1/gfs?latitude=60,60&longitude=0,90&hourly=wind_speed_10hPa,wind_direction_10hPa,temperature_10hPa&forecast_days=16&models=gfs_global" | head -c 900
          echo; echo "== OM profile"
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=44.145&longitude=10.663&elevation=1388&hourly=temperature_925hPa,relative_humidity_925hPa,geopotential_height_925hPa,temperature_850hPa,relative_humidity_850hPa,geopotential_height_850hPa,temperature_700hPa,relative_humidity_700hPa,geopotential_height_700hPa,freezing_level_height&forecast_days=1&models=ecmwf_ifs025,icon_global,gfs_global,italia_meteo_arpae_icon_2i" | head -c 1500
