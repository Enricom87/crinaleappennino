name: Probe bot (temporaneo)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "token length: ${#T}"
          curl -s https://api.telegram.org/bot$T/getMe | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('getMe ok:',d.get('ok'),d.get('error_code'),d.get('description'),r.get('username'),r.get('first_name'))"
          curl -s https://api.telegram.org/bot$T/getWebhookInfo | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('hook:',d.get('ok'),d.get('description'),{k:r.get(k) for k in ('url','pending_update_count','last_error_date','last_error_message')})"
          curl -s -o /dev/null -w "worker /reports.json %{http_code}\n" "https://crinale-bot.enrico-marchionni.workers.dev/reports.json?loc=abetone"
