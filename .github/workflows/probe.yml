name: Prova Brevo (temporaneo)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.BREVO_API_KEY }}
        run: |
          echo "lunghezza chiave: ${#K}"
          curl -s -H "api-key: $K" -H "accept: application/json" https://api.brevo.com/v3/account | python3 -c "import sys,json;d=json.load(sys.stdin);print('account:',d.get('email') or d)"
          curl -s -H "api-key: $K" -H "accept: application/json" https://api.brevo.com/v3/contacts/lists/2 | python3 -c "import sys,json;d=json.load(sys.stdin);print('lista 2:',d.get('name'),d.get('totalSubscribers'),d.get('message',''))"
          curl -s -H "api-key: $K" -H "accept: application/json" https://api.brevo.com/v3/senders | python3 -c "import sys,json;d=json.load(sys.stdin);print('mittenti:',[(x.get('email'),x.get('active')) for x in d.get('senders',[])] or d)"
          curl -s -H "api-key: $K" -H "accept: application/json" https://api.brevo.com/v3/senders/domains | python3 -c "import sys,json;d=json.load(sys.stdin);print('domini:',[(x.get('domain_name'),x.get('authenticated'),x.get('verified')) for x in d.get('domains',[])] or d)"
