name: Probe bot (temporaneo)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s https://api.telegram.org/bot$T/getWebhookInfo | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('hook:',{k:r.get(k) for k in ('url','pending_update_count','last_error_date','last_error_message','allowed_updates','has_custom_certificate')})"
          echo "setup:"; curl -s "https://crinale-bot.enrico-marchionni.workers.dev/setup" | head -c 300; echo
          curl -s https://api.telegram.org/bot$T/getWebhookInfo | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('hook2:',{k:r.get(k) for k in ('url','pending_update_count','last_error_date','last_error_message')})"
