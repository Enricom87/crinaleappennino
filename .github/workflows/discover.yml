name: Cerca percorsi OpenStreetMap

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python pipeline/discover_routes.py
      - run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add data/osm_index.json
          git diff --cached --quiet || git commit -m "indice percorsi OpenStreetMap"
          git push
