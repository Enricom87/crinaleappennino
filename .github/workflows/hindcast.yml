name: Storico (fattibilità)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hindcast
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u pipeline/hindcast/probe.py
      - name: Salva il risultato
        run: |
          git config user.name "crinale-bot"
          git config user.email "bot@crinaleappennino.it"
          git add data/hindcast/probe.json
          git commit -m "storico: verifica fattibilità" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
