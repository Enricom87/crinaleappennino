name: Foto
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python pipeline/photos.py
      - run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/photos
          git diff --cached --quiet || git commit -m "foto $(date -u +%F_%H%M)"
          git pull --rebase && git push
